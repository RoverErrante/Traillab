<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0'),R=6371e3,rad=Math.PI/180,SP=['Ciclismo','Senderismo','Carrera','Caminata'];
const f=(x,d=1)=>x==null||isNaN(x)?'—':(+x).toFixed(d);
const fT=s=>{if(s==null||isNaN(s))return'—';s=Math.round(s);const h=s/3600|0,m=s%3600/60|0;return(h?h+':'+p2(m):m)+':'+p2(s%60)};
const e=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),dt=t=>new Date(t).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});

let rp,cpd,cm='sp',mts=['ele'],rd=['ele','sp','hr'],comb=true,shown=[],acts=[],segs=[],cur=null,view='A',rng=[0,1000],mt='ele',live=null,hrNow=null,HM=190,cache={},rs='Todos',wl=null;
try{acts=JSON.parse(localStorage.getItem('tl_a')||'[]');segs=JSON.parse(localStorage.getItem('tl_s')||'[]');HM=+localStorage.getItem('tl_h')||190}catch(x){}
const save=()=>{try{localStorage.setItem('tl_a',JSON.stringify(acts));localStorage.setItem('tl_s',JSON.stringify(segs));localStorage.setItem('tl_h',HM)}catch(x){alert('Almacenamiento lleno: borra actividades antiguas')}};
/* ---------- parsers ---------- */
const num=x=>x==null||x===''||isNaN(+x)?null:+x,tm=s=>{const v=Date.parse(s);return isNaN(v)?null:v/1e3};
const q=(el,n)=>{for(const x of el.getElementsByTagName('*'))if(x.localName==n)return num(x.textContent);return null};
const qs=(el,n)=>{for(const x of el.getElementsByTagName('*'))if(x.localName==n)return x.textContent;return null};
const pgpx=d=>[...d.getElementsByTagName('trkpt')].map(x=>[tm(qs(x,'time')),+x.getAttribute('lat'),+x.getAttribute('lon'),q(x,'ele'),q(x,'hr'),q(x,'cad'),q(x,'power')??q(x,'watts')]);
const ptcx=d=>[...d.getElementsByTagName('Trackpoint')].map(x=>[tm(qs(x,'Time')),q(x,'LatitudeDegrees'),q(x,'LongitudeDegrees'),q(x,'AltitudeMeters'),q(x,'Value'),q(x,'Cadence')??q(x,'RunCadence'),q(x,'Watts')]).filter(p=>p[1]!=null);
function pkml(d){const all=[...d.getElementsByTagName('*')],w=all.filter(x=>x.localName=='when'),c=all.filter(x=>x.localName=='coord');
if(c.length)return c.map((x,i)=>{const a=x.textContent.trim().split(/\s+/);return[tm(w[i]?.textContent),+a[1],+a[0],num(a[2]),null,null,null]});
const o=[];for(const x of d.getElementsByTagName('coordinates'))x.textContent.trim().split(/\s+/).forEach(s=>{const a=s.split(',');if(a.length>1)o.push([null,+a[1],+a[0],num(a[2]),null,null,null])});return o}
function pfit(b){const v=new DataView(b),hs=v.getUint8(0),end=Math.min(b.byteLength,hs+v.getUint32(4,true)),defs={},out=[],rd=(p,s,l)=>s==1?v.getUint8(p):s==2?v.getUint16(p,l):s==4?v.getUint32(p,l):null;let o=hs,sp=null;
while(o<end){const h=v.getUint8(o++);
if(!(h&128)&&(h&64)){const l=v.getUint8(o+1)==0,mn=v.getUint16(o+2,l),nf=v.getUint8(o+4),fl=[];let sz=0;for(let i=0;i<nf;i++){const s=v.getUint8(o+6+i*3);fl.push([v.getUint8(o+5+i*3),s]);sz+=s}o+=5+nf*3;if(h&32){const nd=v.getUint8(o++);for(let i=0;i<nd;i++)sz+=v.getUint8(o+1+i*3);o+=nd*3}defs[h&15]={l,mn,fl,sz}}
else{const d=defs[h&128?(h>>5)&3:h&15];if(!d)break;
if(d.mn==20||d.mn==18){const r={};let p=o;for(const[fn,s]of d.fl){r[fn]=rd(p,s,d.l);p+=s}
if(d.mn==18)sp=({1:'Carrera',2:'Ciclismo',11:'Caminata',17:'Senderismo'})[r[5]]||sp;
else if(r[0]!=null&&r[0]!=2147483647&&r[1]!=null){const ea=r[78],al=ea!=null&&ea!=4294967295?ea/5-500:r[2]!=null&&r[2]!=65535?r[2]/5-500:null,ok=(x,m)=>x!=null&&x<m?x:null;
out.push([r[253]!=null?r[253]+631065600:null,(r[0]|0)*180/2**31,(r[1]|0)*180/2**31,al,ok(r[3],255),ok(r[4],255),ok(r[7],65535)])}}
o+=d.sz}}
out.sport=sp;return out}
async function parse(fl){const x=fl.name.toLowerCase().split('.').pop();if(x=='fit')return pfit(await fl.arrayBuffer());let t;
if(x=='kmz'){const z=await JSZip.loadAsync(await fl.arrayBuffer()),k=Object.keys(z.files).find(k=>/\.kml$/i.test(k));if(!k)throw Error('KMZ sin KML');t=await z.files[k].async('string')}else t=await fl.text();
const d=new DOMParser().parseFromString(t,'application/xml');return x=='gpx'?pgpx(d):x=='tcx'?ptcx(d):x=='kml'?pkml(d):(()=>{throw Error('Formato no soportado')})()}
/* ---------- análisis ---------- */
function prep(a){if(cache[a.id])return cache[a.id];const p=a.p,n=p.length,t0=p[0][0],hasT=t0!=null&&p[n-1][0]>t0,D=[0],T=p.map((x,i)=>hasT?x[0]-t0:i);
for(let i=1;i<n;i++)D[i]=D[i-1]+hav(p[i-1],p[i]);
const E=p.map((_,i)=>{let s=0,c=0;for(let j=Math.max(0,i-3);j<=Math.min(n-1,i+3);j++)if(p[j][3]!=null){s+=p[j][3];c++}return c?s/c:null});
const S=p.map((_,i)=>{const a=Math.max(0,i-2),b=Math.min(n-1,i+2),d=T[b]-T[a];return hasT&&d>0?(D[b]-D[a])/d:null});
const G=[];let m=0;for(let i=0;i<n;i++){while(m<n-1&&D[m]-D[i]<50)m++;const d=D[m]-D[i];G[i]=d>=30&&E[i]!=null&&E[m]!=null?Math.max(-40,Math.min(40,(E[m]-E[i])/d*100)):null}
return cache[a.id]={p,n,D,T,E,S,G,hasT}}
function st(P,i,j){const{p,D,T,E,S,G,hasT}=P;let mv=0,gain=0,loss=0,ref=null,hs=0,hc=0,hm=0,ps=0,pc=0,cs=0,cc=0,mx=0,A=-1e9,B=1e9,mg=-99,ng=99,zs=[0,0,0,0,0];
for(let k=i;k<=j;k++){const x=p[k],el=E[k],d=k>i&&hasT?T[k]-T[k-1]:0;
if(d>0&&d<60){if((D[k]-D[k-1])/d>.5)mv+=d;if(x[4]!=null){const z=x[4]/HM;zs[z<.6?0:z<.7?1:z<.8?2:z<.9?3:4]+=d}}
if(x[4]!=null){hs+=x[4];hc++;hm=Math.max(hm,x[4])}if(x[6]!=null){ps+=x[6];pc++}if(x[5]>0){cs+=x[5];cc++}
if(S[k]!=null&&S[k]<45)mx=Math.max(mx,S[k]);
if(el!=null){A=Math.max(A,el);B=Math.min(B,el);if(ref==null)ref=el;else if(el-ref>=3){gain+=el-ref;ref=el}else if(ref-el>=3){loss+=ref-el;ref=el}}
if(G[k]!=null){mg=Math.max(mg,G[k]);ng=Math.min(ng,G[k])}}
let np=null;if(pc>10){let s=0,a=i,qq=0,c=0;for(let k=i;k<=j;k++){s+=p[k][6]||0;while(k>a&&T[k]-T[a]>=30){s-=p[a][6]||0;a++}qq+=(s/(k-a+1))**4;c++}np=(qq/c)**.25}
const dist=D[j]-D[i];return{dist,time:T[j]-T[i],nt:!hasT,mv,avg:mv?dist/mv:null,max:mx||null,gain,loss,maxA:A>-1e8?A:null,minA:B<1e8?B:null,mg:mg>-99?mg:null,ng:ng<99?ng:null,hr:hc?hs/hc:null,hmax:hm||null,pw:pc?ps/pc:null,np,cad:cc?cs/cc:null,zs}}
function best(P){const{p,D,T,hasT,n}=P,r={d:{},w:{}};if(!hasT)return r;
for(const L of[1000,5000,10000,20000,40000]){if(D[n-1]<L)continue;let b=1e12,i=0;for(let j=1;j<n;j++){while(i+1<j&&D[j]-D[i+1]>=L)i++;if(D[j]-D[i]>=L)b=Math.min(b,T[j]-T[i])}r.d[L]=b}
const c=[0];p.forEach((x,k)=>c[k+1]=c[k]+(x[6]||0));if(c[n]>0)for(const L of[5,60,300,1200]){if(T[n-1]<L)continue;let b=0,i=0;for(let j=0;j<n;j++){while(i+1<j&&T[j]-T[i+1]>=L)i++;if(T[j]-T[i]>=L)b=Math.max(b,(c[j+1]-c[i])/(j-i+1))}r.w[L]=b}

function rec(P){const{p,T,n}=P;let b=0,j=0;for(let i=0;i<n;i++){if(p[i][4]==null)continue;if(j<i)j=i;while(j<n&&T[j]-T[i]<60)j++;if(j>=n)break;if(p[j][4]!=null)b=Math.max(b,p[i][4]-p[j][4])}return b||null}
function add(p,name,fs){p=p.filter(x=>x[1]!=null&&x[2]!=null&&!isNaN(x[1])&&Math.abs(x[1])<=90&&!(x[1]==0&&x[2]==0));if(p.length<2){alert('El archivo no tiene puntos GPS');return}
const a={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,p},P=prep(a),s=st(P,0,P.n-1);s.b=best(P);s.rc=rec(P);a.s=s;a.date=p[0][0]?p[0][0]*1000:Date.now();
const dup=acts.find(x=>x.date==a.date&&Math.abs(x.s.dist-s.dist)<5);if(dup){delete cache[a.id];alert('Esa actividad ya estaba guardada');return dup}
a.sport=fs||(s.avg==null||s.avg*3.6<6?'Senderismo':s.avg*3.6<13&&s.max*3.6<26?'Carrera':'Ciclismo');
const k=Math.ceil(p.length/3000);a.p=p.filter((_,i)=>i%k==0).map(x=>[x[0],+x[1].toFixed(5),+x[2].toFixed(5),x[3]==null?null:Math.round(x[3]*10)/10,x[4],x[5],x[6]]);
delete cache[a.id];acts.push(a);save();return a}
/* ---------- vistas ---------- */
const T_=(l,v,u='')=>v==null||v==='—'?'':`<div class="k"><span>${l}</span><b>${v}</b><small>${u}</small></div>`;
function kpis(s,sp){const k=x=>x==null?null:f(x*3.6);return`<div class="g">`+T_('Distancia',f(s.dist/1000,2),'km')+T_('Tiempo total',s.nt?null:fT(s.time))+T_('En movimiento',s.mv?fT(s.mv):null)+T_('Vel. media',k(s.avg),'km/h')+(sp!='Ciclismo'&&s.avg?T_('Ritmo',fT(1000/s.avg),'min/km'):'')+T_('Vel. máx',k(s.max),'km/h')+T_('Desnivel +',f(s.gain,0),'m')+T_('Desnivel −',f(s.loss,0),'m')+T_('Alt. máx',f(s.maxA,0),'m')+T_('Alt. mín',f(s.minA,0),'m')+T_('Pend. máx +',f(s.mg),'%')+T_('Pend. máx −',f(s.ng),'%')+T_('FC media',s.hr&&f(s.hr,0),'lpm')+T_('FC máx',s.hmax,'lpm')+T_('Recuperación 1 min',s.rc?'−'+s.rc:null,'lpm')+T_('Pot. media',s.pw&&f(s.pw,0),'W')+T_('Pot. normalizada',s.np&&f(s.np,0),'W')+T_('Cadencia',s.cad&&f(s.cad,0),'rpm')+`</div>`}
function chart(P,i,j){const{p,n,D}=P,y=p.map((x,k)=>mt=='ele'?P.E[k]:mt=='sp'?(P.S[k]==null?null:P.S[k]*3.6):mt=='gr'?P.G[k]:x[mt=='hr'?4:mt=='cad'?5:6]),s=Math.ceil(n/300);let lo=1e9,hi=-1e9;
for(let k=0;k<n;k+=s)if(y[k]!=null){lo=Math.min(lo,y[k]);hi=Math.max(hi,y[k])}
if(lo>hi)return'<p class="m">Sin datos</p>';const t=D[n-1]||1,X=k=>D[k]/t*600,Y=v=>140-(v-lo)/((hi-lo)||1)*130;let d='',pv=0;
for(let k=0;k<n;k+=s){if(y[k]==null){pv=0;continue}d+=(pv?'L':'M')+X(k).toFixed(0)+' '+Y(y[k]).toFixed(0);pv=1}
return`<svg viewBox="0 0 600 150" style="width:100%"><path d="${d}" fill="none" stroke="var(--a)" stroke-width="1.5"/><rect x="${X(i)}" width="${X(j)-X(i)}" height="150" fill="var(--a)" opacity=".2"/><text x="2" y="10" fill="var(--m)" font-size="10">${f(hi,0)}</text><text x="2" y="148" fill="var(--m)" font-size="10">${f(lo,0)}</text></svg>`}
function route(P,i,j){const{p,n}=P,la=p.map(x=>x[1]),lo=p.map(x=>x[2]),a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo),k=Math.cos((a+b)/2*rad),w=(d-c)*k||1e-5,h=b-a||1e-5,s=Math.min(280/w,280/h),X=z=>(10+(p[z][2]-c)*k*s).toFixed(1),Y=z=>(10+(b-p[z][1])*s).toFixed(1),m=Math.ceil(n/400);
rp={X,Y};const pl=(f0,t)=>{let r='';for(let z=f0;z<=t;z+=m)r+=X(z)+','+Y(z)+' ';return r+X(t)+','+Y(t)};
return`<svg class="rv" viewBox="0 0 ${(w*s+20).toFixed(0)} ${(h*s+20).toFixed(0)}" style="max-height:300px;width:100%;touch-action:none"><polyline points="${pl(0,n-1)}" fill="none" stroke="var(--m)" stroke-width="2" stroke-linejoin="round"/><polyline points="${pl(i,j)}" fill="none" stroke="var(--a)" stroke-width="4" stroke-linejoin="round"/><circle cx="${X(0)}" cy="${Y(0)}" r="5" fill="#2ecc71"/><circle cx="${X(n-1)}" cy="${Y(n-1)}" r="5" fill="#e74c3c"/><circle id="rm" cx="-9" cy="-9" r="0" fill="#fff" stroke="var(--a)" stroke-width="3"/></svg>`}
const MT={ele:['Altitud','m','#2f80ed',0],sp:['Velocidad','km/h','#e8590c',1],gr:['Pendiente','%','#8e6bd8',1],hr:['Pulso','lpm','#e5383b',0],rh:['Recuperación FC (60 s)','lpm','#16a085',0],cad:['Cadencia','rpm','#d4a017',0],pw:['Potencia','W','#7f8c8d',0]};const has=(m,P)=>{const s=cur.s;return m=='ele'||m=='gr'||(m=='sp'&&P.hasT)||(m=='hr'&&s.hr)||(m=='rh'&&s.hr&&P.hasT)||(m=='cad'&&s.cad)||(m=='pw'&&s.pw)};
function ser(P,m){P.y=P.y||{};if(P.y[m])return P.y[m];const{p,T,n}=P;let y;if(m=='ele')y=P.E;else if(m=='sp')y=P.S.map(v=>v==null?null:v*3.6);else if(m=='gr')y=P.G;else if(m=='rh'){y=[];let j=0;for(let i=0;i<n;i++){y[i]=null;if(p[i][4]==null||!P.hasT)continue;if(j<i)j=i;while(j<n&&T[j]-T[i]<60)j++;if(j<n&&p[j][4]!=null)y[i]=p[i][4]-p[j][4]}}else y=p.map(x=>x[m=='hr'?4:m=='cad'?5:6]);return P.y[m]=y}
function chips(k){const P=prep(cur),A=k=='mts'?mts:rd;return Object.keys(MT).filter(m=>has(m,P)).map(m=>`<button class='${A.includes(m)?'on':''}' style='border-color:${MT[m][2]}' data-k='${k}' data-m='${m}'>${MT[m][0]}</button>`).join('')}
const tg=(k,m)=>{if(k=='c'){comb=!comb;return render()}const A=k=='mts'?mts:rd,i=A.indexOf(m);if(i<0)A.push(m);else if(A.length>1)A.splice(i,1);render()};
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('button[data-k]');if(b)tg(b.dataset.k,b.dataset.m)});
